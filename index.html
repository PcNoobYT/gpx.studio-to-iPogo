
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>gpx.studio to iPogo converter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #101827;
            color: #f8fafc;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: 30px auto;
            padding: 32px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 24px 0 10px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 250px;
            padding: 14px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: #e2e8f0;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: vertical;
        }

        textarea:focus {
            outline: 2px solid #38bdf8;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: #082f49;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #7dd3fc;
        }

        .copy-button {
            background: #334155;
            color: #f8fafc;
        }

        .copy-button:hover {
            background: #475569;
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #7f1d1d;
            color: #fee2e2;
        }

        .note {
            font-size: 13px;
            text-align: center;
        }

        a {
            color: skyblue;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .container {
                margin: 12px auto;
                padding: 20px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>gpx.studio to iPogo converter</h1>

        <p>
            Paste your gpx.studio text here to convert it to a iPogo recognizable version
        </p>

        <div class="error" id="error"></div>

        <form id="converter_form">

            <label for="gpx_content">Input gpx.studio text</label>

            <textarea
                id="gpx_content"
                name="gpx_content"
                placeholder="Paste your gpx.studio text here..."
                required
            ></textarea>

            <button type="submit">
                Convert text
            </button>

        </form>

        <div id="output_section" style="display: none;">

            <label for="output_gpx">iPogo version</label>

            <textarea
                id="output_gpx"
                readonly
            ></textarea>

            <button
                type="button"
                class="copy-button"
                onclick="copyOutput()"
            >
                Copy output
            </button>

        </div>

        <p>
            Create a gpx route on
            <a href="https://www.gpx.studio" target="_blank" rel="noopener noreferrer">gpx.studio</a>
        </p>

    </main>

    <script>

        // Convert XML attribute values safely
        function escapeXmlAttribute(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/"/g, "&quot;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }


        // GPX to iPogo conversion
        function convertGPX(input) {

            if (!input.trim()) {
                throw new Error("Please enter GPX content.");
            }

            // Parse the input XML
            const parser = new DOMParser();

            const xml = parser.parseFromString(
                input,
                "application/xml"
            );

            // Check for XML parsing errors
            if (
                xml.getElementsByTagName("parsererror").length > 0 ||
                xml.documentElement.localName === "parsererror"
            ) {
                throw new Error("The entered content is not valid XML.");
            }

            // Find all track points, including namespaced elements
            const allElements = xml.getElementsByTagName("*");

            const lines = [
                '<?xml version="1.0" encoding="utf-8" standalone="yes"?>',
                '<gpx version="1.1" Visit="https://discord.gg/iPogo">'
            ];

            let count = 0;

            for (const point of allElements) {

                if (point.localName !== "trkpt") {
                    continue;
                }

                const lat = point.getAttribute("lat");
                const lon = point.getAttribute("lon");

                if (lat !== null && lon !== null) {

                    lines.push(
                        `<wpt lat="${escapeXmlAttribute(lat)}" lon="${escapeXmlAttribute(lon)}"></wpt>`
                    );

                    count++;
                }
            }

            // Check if any track points were found
            if (count === 0) {
                throw new Error(
                    "No track points were found in this GPX content."
                );
            }

            lines.push("</gpx>");

            return lines.join("\n");
        }


        // Handle form submission
        document.getElementById("converter_form")
            .addEventListener("submit", function(e) {

                e.preventDefault();

                const input = document.getElementById("gpx_content").value;
                const error = document.getElementById("error");
                const outputSection = document.getElementById("output_section");
                const output = document.getElementById("output_gpx");

                // Reset previous results
                error.style.display = "none";
                error.textContent = "";

                outputSection.style.display = "none";
                output.value = "";

                try {

                    // Perform conversion
                    const result = convertGPX(input);

                    // Display converted GPX
                    output.value = result;
                    outputSection.style.display = "block";

                } catch (err) {

                    // Display error
                    error.textContent = err.message;
                    error.style.display = "block";

                }

            });


        // Copy converted output
        async function copyOutput() {

            const output = document.getElementById("output_gpx");
            const button = document.querySelector(".copy-button");

            try {

                await navigator.clipboard.writeText(output.value);

                button.textContent = "Copied!";

                setTimeout(() => {
                    button.textContent = "Copy output";
                }, 2000);

            } catch (err) {

                // Fallback for browsers without clipboard API access
                output.select();
                output.setSelectionRange(0, output.value.length);

                const successful = document.execCommand("copy");

                if (successful) {
                    button.textContent = "Copied!";

                    setTimeout(() => {
                        button.textContent = "Copy output";
                    }, 2000);
                } else {
                    button.textContent = "Copy failed";
                }

            }
        }

    </script>

</body>
</html>
